name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs these checks before publishing.
  workflow_call:

# A newer push to a pull request cancels its older run. Every other run (main,
# and calls from the release workflow) gets a group of its own, so it always finishes.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Ubuntu mirror sometimes throttles package downloads to about 100 kB/s, which has stretched this
      # 20-second install to 18 minutes. The downloaded packages are kept between runs, so apt only fetches
      # the ones that changed; the key follows the runner image, so the kept set is refreshed with it.
      - id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/apt-archives
          key: apt-${{ steps.image.outputs.version }}
          restore-keys: apt-
      - run: |
          mkdir -p /tmp/apt-archives
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives=/tmp/apt-archives/ ffmpeg mesa-vulkan-drivers libvulkan1
          # drop superseded packages and apt's own lock and download folder, leaving only what the cache should keep
          sudo apt-get autoclean -o Dir::Cache::Archives=/tmp/apt-archives/
          sudo rm -rf /tmp/apt-archives/lock /tmp/apt-archives/partial
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # renders on the CPU through Mesa's software Vulkan driver
      - run: cargo test --locked
      # fails when a dependency's license isn't one about.toml accepts
      - run: scripts/third-party-licenses.sh notices/THIRD-PARTY-LICENSES.txt
      - name: npm packages stage and pack
        run: |
          mkdir -p artifacts/linux-x64 && cp target/debug/yehi artifacts/linux-x64/
          node npm/stage.mjs --artifacts artifacts --out dist --notices notices/THIRD-PARTY-LICENSES.txt
          npm pack ./dist/yehi-linux-x64 ./dist/yehi --dry-run
          npm install --no-save ./dist/yehi-linux-x64 ./dist/yehi
          npx yehi check examples/hello.json

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release --locked
      - run: cargo test --bins --locked
      # the Intel Mac binary is cross-compiled on Apple silicon at release
      - run: cargo build --locked --target x86_64-apple-darwin

  # no GPU or ffmpeg on the runner, so the unit tests and a build
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --locked
      - run: cargo test --bins --locked
      - run: ./target/debug/yehi.exe docs > $null

  # the oldest Rust that builds yehi, Cargo.toml's rust-version
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --locked --all-targets
