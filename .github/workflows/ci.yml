name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs these checks before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg mesa-vulkan-drivers libvulkan1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # renders on the CPU through Mesa's software Vulkan driver
      - run: cargo test
      - name: npm packages stage and pack
        run: |
          mkdir -p artifacts/linux-x64 && cp target/debug/yehi artifacts/linux-x64/
          node npm/stage.mjs --artifacts artifacts --out dist
          npm pack ./dist/yehi-linux-x64 ./dist/yehi --dry-run
          npm install --no-save ./dist/yehi-linux-x64 ./dist/yehi
          npx yehi check examples/hello.json

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release
      - run: cargo test --bins
