name: Release

# Push a tag matching Cargo.toml's version (v0.2.0) on a commit in main to build every platform's binary, publish
# the npm packages (@zhamann/yehi and its yehi-<platform> binaries), and attach the binaries to a GitHub release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# one release per tag at a time; a second push of the same tag waits rather than racing the first
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # a known compiler for published binaries; bump it on purpose
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: v
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match Cargo.toml version $v" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME is on a commit that isn't in main; tag a commit from main" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: [version, checks]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: darwin-arm64, target: aarch64-apple-darwin, os: macos-latest }
          - { platform: darwin-x64, target: x86_64-apple-darwin, os: macos-latest }
          # linked against glibc 2.17 with zig, so the binaries run on any Linux from the last decade
          - { platform: linux-x64, target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, glibc: "2.17" }
          - { platform: linux-arm64, target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, glibc: "2.17" }
          - { platform: win32-x64, target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.glibc }}" ]; then
            pip install ziglang==0.17.1 cargo-zigbuild==0.24.1
            cargo zigbuild --profile dist --locked --target ${{ matrix.target }}.${{ matrix.glibc }}
          else
            cargo build --profile dist --locked --target ${{ matrix.target }}
          fi
      - name: Collect the binary
        shell: bash
        run: |
          mkdir -p out/${{ matrix.platform }}
          exe=yehi; [ "${{ runner.os }}" = Windows ] && exe=yehi.exe
          cp target/${{ matrix.target }}/dist/$exe out/${{ matrix.platform }}/
          bin=out/${{ matrix.platform }}/$exe
          # run it where this runner can: natively, or the Intel Mac build through Rosetta
          if [ "${{ matrix.platform }}" = darwin-x64 ]; then
            if arch -x86_64 /usr/bin/true 2>/dev/null; then arch -x86_64 "$bin" --version; else echo "no Rosetta: not run"; fi
          else
            "$bin" --version
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: out/${{ matrix.platform }}

  notices:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: scripts/third-party-licenses.sh notices/THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: notices

  publish:
    needs: [version, build, notices]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # npm 11.5 or later publishes through trusted publishing when a package has it set up, and with
      # NPM_TOKEN otherwise
      - run: npm install -g npm@11
      - run: node npm/stage.mjs --artifacts artifacts --out dist --notices artifacts/notices/THIRD-PARTY-LICENSES.txt --require-all
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # a prerelease (0.2.0-rc.1) goes out under "next", so "latest" stays on the newest stable release
          tag=latest; case "$VERSION" in *-*) tag=next;; esac
          # the platform packages first, so the launcher never points at a binary that isn't there; skip what's
          # already published, so a failed release can be re-run
          for dir in dist/yehi-* dist/yehi; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published"
            else
              # ./ so npm reads it as a folder, not a GitHub user/repo
              npm publish "./$dir" --access public --provenance --tag "$tag"
            fi
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p assets
          for p in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            d=artifacts/$p
            # artifact transfer drops the executable bit
            chmod +x "$d"/yehi*
            cp LICENSE artifacts/notices/THIRD-PARTY-LICENSES.txt "$d"/
            name=yehi-$VERSION-$p
            if [ "$p" = win32-x64 ]; then
              (cd "$d" && zip -q "../../assets/$name.zip" ./*)
            else
              tar -czf "assets/$name.tar.gz" -C "$d" .
            fi
          done
          (cd assets && sha256sum yehi-* > SHA256SUMS)
          pre=""; case "$VERSION" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" assets/* --generate-notes $pre \
            || gh release upload "$GITHUB_REF_NAME" assets/* --clobber
