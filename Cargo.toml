[package]
name = "yehi"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fast GPU video rendering from a JSON spec, built for AI agents"
readme = "README.md"
keywords = ["video", "render", "gpu", "motion-graphics", "agents"]
categories = ["multimedia::video", "command-line-utilities", "rendering"]

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
fontdb = "0.24.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
pollster = "1.0.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
swash = "0.2.10"
wgpu = "30.0.1"
